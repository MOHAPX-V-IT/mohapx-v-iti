name: Публикация журнала в Telegram

on:
  schedule:
    - cron: '0 7 * * *'    # 10:00 по Москве
    - cron: '0 14 * * *'   # 17:00 по Москве
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Опубликовать записи, не дожидаясь их даты'
        type: boolean
        default: false
      max_per_run:
        description: 'Сколько записей отправить за один запуск'
        type: string
        default: '2'

permissions:
  contents: write

concurrency:
  group: telegram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Отправить новые записи
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '2' }}
        run: node .github/scripts/rss-to-telegram.mjs

      - name: Запомнить, что уже отправлено
        run: |
          if git diff --quiet -- .github/telegram-state.json; then
            echo "Состояние не изменилось."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/telegram-state.json
          git commit -m "telegram: отмечены опубликованные записи"
          git push
